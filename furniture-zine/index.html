<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furniture Zine — Karan Chulliparambil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0C0C0C}
body{background:#0C0C0C;color:#EBDDC5;font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:80px 24px}
.hdr{text-align:center;margin-bottom:48px}
.hdr .cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:14px}
.hdr h1{font-weight:900;font-size:clamp(40px,7vw,90px);letter-spacing:-.03em;line-height:.95;text-transform:uppercase}
.hdr .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-top:10px}
.gallery{display:flex;flex-direction:column;gap:24px;margin-bottom:48px}
.gallery img{width:100%;display:block;background:#111}
.back{text-align:center;margin-top:60px}
.back a{color:#EBDDC5;text-decoration:none;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid #EBDDC5;padding-bottom:2px;opacity:.85;transition:opacity .2s}
.back a:hover{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <p class="cap">Design · 2022</p>
    <h1>Furniture Zine</h1>
    <p class="sub">Print · Editorial</p>
  </div>
  <div class="gallery">
    <img src="/img/furniture-zine-page-1.png?v=3" alt="Furniture Zine page 1">
    <img src="/img/furniture-zine-page-2.png?v=3" alt="Furniture Zine page 2">
  </div>
  <div class="back"><a href="/projects/">← Back to Projects</a></div>
</div>
</body>
</html>
